<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Petualangan Berhitung Kelas 2</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f9ff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        #game-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
            border: 5px solid #4caf50;
        }

        h1 { color: #2c3e50; font-size: 24px; }
        
        .stats {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #555;
            margin-bottom: 20px;
        }

        #question {
            font-size: 48px;
            margin: 20px 0;
            color: #333;
        }

        input[type="number"] {
            width: 100px;
            font-size: 32px;
            padding: 10px;
            text-align: center;
            border: 3px solid #ddd;
            border-radius: 10px;
            outline: none;
        }

        button {
            display: block;
            width: 100%;
            padding: 15px;
            margin-top: 20px;
            font-size: 20px;
            background-color: #4caf50;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        button:active { transform: scale(0.98); }

        #feedback {
            margin-top: 20px;
            font-weight: bold;
            height: 25px;
        }

        .correct { color: #4caf50; animation: bounce 0.5s; }
        .wrong { color: #f44336; }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div id="game-container">
    <h1>🧮 Jago Hitung!</h1>
    
    <div class="stats">
        <span>Skor: <span id="score">0</span></span>
        <span>Level: <span id="level">1</span></span>
    </div>

    <div id="question">? + ?</div>
    
    <input type="number" id="answer" placeholder="..." autofocus>
    
    <button onclick="checkAnswer()">Kirim Jawaban!</button>
    
    <div id="feedback"></div>
</div>

<script>
    let score = 0;
    let level = 1;
    let num1, num2, correctAnswer;

    function generateQuestion() {
        // Rentang angka meningkat setiap 5 poin skor
        let range = 10 + (Math.floor(score / 5) * 5);
        num1 = Math.floor(Math.random() * range) + 1;
        num2 = Math.floor(Math.random() * range) + 1;
        correctAnswer = num1 + num2;
        
        document.getElementById('question').innerText = `${num1} + ${num2}`;
        document.getElementById('answer').value = '';
        document.getElementById('answer').focus();
    }

    function checkAnswer() {
        const userAnswer = parseInt(document.getElementById('answer').value);
        const feedback = document.getElementById('feedback');

        if (userAnswer === correctAnswer) {
            score++;
            feedback.innerText = "🌟 Hebat! Kamu Benar!";
            feedback.className = "correct";
            
            // Update Level
            level = Math.floor(score / 5) + 1;
            document.getElementById('score').innerText = score;
            document.getElementById('level').innerText = level;
            
            setTimeout(() => {
                feedback.innerText = "";
                generateQuestion();
            }, 1000);

        } else {
            feedback.innerText = "❌ Coba lagi ya...";
            feedback.className = "wrong";
            document.getElementById('answer').value = '';
        }
    }

    // Biarkan user menekan "Enter" untuk kirim jawaban
    document.getElementById('answer').addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            checkAnswer();
        }
    });

    // Mulai game pertama kali
    generateQuestion();
</script>

</body>
</html>
